version: '3.8'

services:
  arangodb:
    image: arangodb:3.11
    container_name: skyscholar-arangodb
    restart: unless-stopped
    ports:
      - "8529:8529"
    volumes:
      - arangodb_data:/var/lib/arangodb3
      - arangodb_apps:/var/lib/arangodb3-apps
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8529/_api/version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      - ARANGO_ROOT_PASSWORD=skyscholar_dev_password
      - ARANGO_NO_AUTH=0

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skyscholar-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      arangodb:
        condition: service_healthy
    environment:
      - ARANGO_HOST=http://arangodb:8529
      - ARANGO_USER=root
      - ARANGO_PASSWORD=skyscholar_dev_password
      - CORS_ORIGINS=http://localhost:3000

volumes:
  arangodb_data:
    driver: local
  arangodb_apps:
    driver: local
